<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>english forge - a journey toward fluency</title>

    <meta http-equiv="x-ua-compatible" content="ie=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=inter:wght@400;500;600;700&family=jetbrains+mono&display=swap">

    <!-- docsify theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

    <!-- dark / light theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
        title="docsify-darklight-theme" type="text/css" />

    <!-- sidebar collapse -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar-folder.min.css" />

    <style>
        /* =========================
           design tokens
        ========================== */

        :root {
            --theme-color: #3b82f6;
            --accent: #3b82f6;

            --text-color: #1f2937;
            --muted-text: #6b7280;

            --bg: #ffffff;
            --card: #f8fafc;
            --border: #e5e7eb;
        }

        /* =========================
           base typography
        ========================== */

        body {
            font-family: inter, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .markdown-section {
            line-height: 1.75;
            font-size: 16px;
        }

        /* headings feel more modern */
        .markdown-section h1,
        .markdown-section h2,
        .markdown-section h3 {
            letter-spacing: -0.03em;
            margin-top: 2rem;
        }

        /* =========================
           remove duplicate page title
        ========================== */

        .markdown-section>h1:first-of-type {
            display: none;
        }

        /* =========================
           sidebar cleanup
        ========================== */

        /* .sidebar-nav a[href="/"] {
            display: none;
        } */

        /* =========================
           code styling
        ========================== */

        .markdown-section code:not([class*="lang-"]):not([class*="language-"]) {
            font-family: "jetbrains mono", monospace;
            font-size: 0.85em;
            padding: 0.2em 0.4em;
            border-radius: 6px;
        }

        pre,
        pre code,
        pre[class*="language-"] code {
            font-family: "jetbrains mono", monospace;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--border);
        }

        /* =========================
           plugin ui tweaks
        ========================== */

        .docsify-count {
            margin-right: 60px;
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--text-color);
        }

        /* smooth but lightweight transitions */
        body,
        .sidebar,
        .markdown-section {
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* logo responsiveness */
        .app-name-link img {
            max-width: 100%;
        }
    </style>
</head>

<body>
    <div id="app">loading english forge...</div>

    <script>
        window.$docsify = {
            name: 'english forge',
            repo: 'https://github.com/mosioc/english-forge',

            themeColor: '#3b82f6',

            loadSidebar: true,
            subMaxLevel: 4,
            auto2top: true,
            sidebarDisplayLevel: 1,

            // prevents duplicate injected headings
            autoHeader: false,

            /* =========================
               dark / light theme config
            ========================== */
            darklightTheme: {
                defaultTheme: 'dark',
                light: {
                    accent: '#3b82f6',
                    toggleBackground: '#ffffff',
                    background: '#f8fafc',
                    textColor: '#1f2937',
                    codeTextColor: '#0f172a',
                    codeBackgroundColor: '#e5e7eb',
                    borderColor: '#e5e7eb',
                    blockQuoteColor: '#64748b',
                    highlightColor: '#3b82f6',
                    sidebarSublink: '#475569',
                },
                dark: {
                    accent: '#60a5fa',
                    toggleBackground: '#0f172a',
                    background: '#0f172a',
                    textColor: '#cbd5e1',
                    codeTextColor: '#f8fafc',
                    codeBackgroundColor: '#1e293b',
                    borderColor: '#334155',
                    blockQuoteColor: '#94a3b8',
                    highlightColor: '#60a5fa',
                    sidebarSublink: '#94a3b8',
                }
            },

            /* =========================
               search plugin
            ========================== */
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: 'type to search...',
                noData: 'no results',
                depth: 6,
                hideOtherSidebarContent: true,
            },

            /* =========================
               pagination plugin
            ========================== */
            pagination: {
                previousText: 'prev',
                nextText: 'next',
                crossChapter: true,
                crossChapterText: true,
            },

            /* =========================
               word count plugin
            ========================== */
            // count: {
            //     countable: true,
            //     position: 'top',
            //     margin: '10px',
            //     float: 'right',
            //     fontsize: '0.9em',
            //     color: 'var(--text-color)',
            //     language: 'english',
            //     isExpected: true
            // },

            /* =========================
               custom footer plugin
            ========================== */
            plugins: [
                function (hook) {
                    const footer = `
                        <hr/>
                        <footer style="text-align:center;margin-top:2rem;padding-bottom:2rem;
                        color:var(--text-color);font-size:0.9rem;">
                            <span>
                                english forge by 
                                <a href="https://github.com/mosioc" target="_blank"
                                style="text-decoration:none;font-weight:600;color:var(--accent);">
                                    mehdi maleki (@mosioc)
                                </a>
                            </span>
                        </footer>
                    `;

                    hook.afterEach(function (html) {
                        return html + footer;
                    });
                }
            ]
        };
    </script>

    <!-- =========================
         docsify core
    ========================== -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

    <!-- =========================
         essential plugins
    ========================== -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>

    <!-- =========================
         optional plugins
    ========================== -->
    <!-- <script src="//unpkg.com/docsify-count/dist/countable.min.js"></script> -->
    <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-progress@latest/dist/progress.min.js"></script>

    <!-- =========================
         syntax highlighting
    ========================== -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>

</body>

</html>
